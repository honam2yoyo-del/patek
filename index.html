                <div className="flex items-center py-3 border-b border-[#F2EFE8]">
                  <span className="text-[13px] text-[#8A847E] w-[55px] shrink-0">고객명</span>
                  <input type="text" value={inquiryForm.customerName} onChange={(e) => setInquiryForm({...inquiryForm, customerName: e.target.value})} className="bg-transparent outline-none text-[#2C2724] flex-1 text-sm min-w-[50px]" placeholder="이름" />
                  <span className="text-[13px] text-[#8A847E] w-auto whitespace-nowrap mx-2 shrink-0">생년월일</span>
                  <input type="text" value={inquiryForm.birthDate} onChange={(e) => setInquiryForm({...inquiryForm, birthDate: formatBirthDate(e.target.value)})} className="bg-transparent outline-none text-[#4A443F] text-sm text-right w-[76px] shrink-0 tracking-tight" placeholder="YYYY.MM.DD" maxLength="10" />
                </div>
                <div className="flex items-center py-3 border-b border-[#F2EFE8]">
                  <span className="text-[13px] text-[#8A847E] w-[60px] shrink-0">연락처</span>
                  <input type="text" value={inquiryForm.customerPhone} onChange={(e) => setInquiryForm({...inquiryForm, customerPhone: formatPhoneNumber(e.target.value)})} className="bg-transparent outline-none text-[#2C2724] flex-1 text-sm min-w-0" placeholder="010-0000-0000" maxLength="13" />
                </div>
                <div className="flex items-center py-3 border-b border-[#F2EFE8]">
                  <span className="text-[13px] text-[#8A847E] w-[60px] shrink-0">직업</span>
                  <input type="text" value={inquiryForm.job} onChange={(e) => setInquiryForm({...inquiryForm, job: e.target.value})} className="bg-transparent outline-none text-[#2C2724] flex-1 text-sm min-w-0" placeholder="직업 입력" />
                </div>
                <div className="flex items-center py-3 border-b border-[#F2EFE8]">
                  <span className="text-[13px] text-[#8A847E] w-[60px] shrink-0">특이사항</span>
                  <input type="text" value={inquiryForm.notes} onChange={(e) => setInquiryForm({...inquiryForm, notes: e.target.value})} className="bg-transparent outline-none text-[#2C2724] flex-1 text-sm min-w-0" placeholder="특이사항" />
                </div>
                <div className="flex items-start pt-3">
                  <span className="text-[13px] text-[#8A847E] w-[60px] shrink-0 mt-1">메모</span>
                  <textarea value={inquiryForm.memo} onChange={(e) => setInquiryForm({...inquiryForm, memo: e.target.value})} className="bg-transparent outline-none text-[#2C2724] flex-1 text-sm resize-none h-16 min-w-0" placeholder="메모 입력"></textarea>
                </div>
              </div>

              <div className="flex items-center gap-2 mb-3 ml-1">
                <ClipboardList size={18} className="text-[#8B7355]" />
                <h3 className="font-serif font-bold text-[#3A3532] text-[15px]">구매 희망 제품</h3>
              </div>
              <div className="bg-white border border-[#E8E4DB] rounded-xl overflow-hidden shadow-[0_2px_10px_rgba(0,0,0,0.02)] mb-8">
                <div className="overflow-x-visible no-scrollbar" onTouchStart={e => e.stopPropagation()} onTouchMove={e => e.stopPropagation()}>
                  <div className="min-w-[500px]">
                    <div className="grid grid-cols-[30px_1.2fr_1.4fr_1.2fr_1.2fr_30px] text-[11px] text-[#8A847E] bg-[#FDFBF7] py-2 border-b border-[#E8E4DB] text-center">
                      <div></div><div>날짜</div><div>REF.</div><div>제시일</div><div>비고</div><div>삭제</div>
                    </div>
                    {sortedItems.map((item) => (
                      <div key={item.id} className={`grid grid-cols-[30px_1.2fr_1.4fr_1.2fr_1.2fr_30px] border-b border-[#F2EFE8] items-center text-[12px] transition-all duration-300 relative ${item.isCompleted ? 'bg-[#F9F8F6] text-[#A8A29D] opacity-70 line-through' : 'text-[#4A443F]'}`}>
                        <div className="flex justify-center p-2">
                          <input type="checkbox" checked={item.isCompleted} onChange={(e) => updateInquiryItem(item.id, 'isCompleted', e.target.checked)} className="w-[14px] h-[14px] accent-[#8B7355] cursor-pointer" />
                        </div>
                        <input type="text" value={item.date} onChange={(e) => updateInquiryItem(item.id, 'date', e.target.value)} disabled={item.isCompleted} placeholder="YYYY-MM-DD" className="w-full bg-transparent text-center py-3 outline-none" />
                        
                        {/* 자동완성 기능이 추가된 REF 입력칸 */}
                        <div className="relative border-l border-[#F2EFE8] h-full flex flex-col justify-center">
                            <input 
                              type="text" 
                              value={item.ref} 
                              onChange={(e) => updateInquiryItem(item.id, 'ref', e.target.value.toUpperCase())} 
                              onFocus={() => setFocusedRefIndex(item.id)}
                              onBlur={() => setFocusedRefIndex(null)}
                              disabled={item.isCompleted} 
                              placeholder="REF" 
                              className="w-full bg-transparent text-center py-3 outline-none" 
                            />
                            {/* 드롭다운 영역 */}
                            {focusedRefIndex === item.id && item.ref.length > 0 && (
                                <div className="absolute top-[90%] left-1/2 -translate-x-1/2 w-[140px] bg-white border border-[#E8E4DB] z-[150] max-h-[160px] overflow-y-auto shadow-xl rounded-md">
                                    {PATEK_REFS.filter(r => r.includes(item.ref)).map(match => (
                                        <div
                                           key={match}
                                           className="px-3 py-2 text-center text-[12px] hover:bg-[#F2EFE8] cursor-pointer text-[#4A443F] font-sans transition-colors"
                                           onMouseDown={(e) => {
                                               e.preventDefault(); // onBlur 방지
                                               updateInquiryItem(item.id, 'ref', match);
                                               setFocusedRefIndex(null);
                                           }}
                                        >
                                           {match}
                                        </div>
                                    ))}
                                    {PATEK_REFS.filter(r => r.includes(item.ref)).length === 0 && (
                                        <div className="px-3 py-2 text-center text-[11px] text-[#A8A29D]">검색 결과 없음</div>
                                    )}
                                </div>
                            )}
                        </div>

                        <input type="text" value={item.proposedDate} onChange={(e) => updateInquiryItem(item.id, 'proposedDate', e.target.value)} disabled={item.isCompleted} placeholder="제시일" className="w-full bg-transparent text-center py-3 outline-none border-l border-[#F2EFE8]" />
                        <input type="text" value={item.note} onChange={(e) => updateInquiryItem(item.id, 'note', e.target.value)} disabled={item.isCompleted} placeholder="비고" className="w-full bg-transparent text-center py-3 outline-none border-l border-[#F2EFE8]" />
                        <div className="border-l border-[#F2EFE8] h-full flex items-center justify-center">
                           <button onClick={() => confirmDeleteInquiryItem(item.id)} disabled={item.isCompleted} className="text-[#DCD6CC] hover:text-[#A06C6C] transition-colors"><Trash2 size={16} /></button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
                <button onClick={addInquiryItem} className="w-full py-3 bg-[#6B5A47] hover:bg-[#5A4B3A] text-white flex items-center justify-center gap-2 transition-colors"><Plus size={16} /> <span className="font-sans text-sm tracking-wide">추가하기</span></button>
              </div>
            </div>
          </div>
        );
      };

      const renderAlbumModal = () => {
        if (!isAlbumModalOpen || !albumForm) return null;

        return (
          <div className="absolute inset-0 bg-[#FCFBF9] z-[100] flex flex-col font-sans animate-in slide-in-from-bottom-5">
            <div className="flex justify-between items-center px-5 pt-8 pb-4 bg-[#FCFBF9] sticky top-0 z-20 shrink-0">
              <button onClick={() => setIsAlbumModalOpen(false)} className="text-[#8A847E] text-[15px] hover:text-[#4A443F] py-2">취소</button>
              <a href="https://www.patek.com/en" target="_blank" rel="noopener noreferrer" className="absolute left-1/2 -translate-x-1/2 flex flex-col items-center top-6">
                 <img src="./logo.png" alt="Logo" className="w-12 h-12 object-contain" />
                 <span className="font-serif text-[18px] text-[#3A3532] -mt-1">{albumForm.id ? 'Edit Photo' : 'Upload Photo'}</span>
              </a>
              <button onClick={handleSaveAlbum} className="text-[#8B7355] text-[15px] font-medium hover:text-[#6B5335] py-2">완료</button>
            </div>

            <div className="flex-1 overflow-y-auto px-5 pb-8 mt-8 no-scrollbar">
              <input type="file" multiple={!albumForm.id} accept="image/*" className="hidden" ref={fileInputRef} onChange={handleFileChange} />
              
              <div className="flex overflow-x-auto gap-3 no-scrollbar mb-6 pb-2 px-1">
                {albumForm.files && albumForm.files.length > 0 ? (
                  albumForm.files.map((file, idx) => {
                    const url = URL.createObjectURL(file);
                    return (
                      <div key={idx} className="relative w-28 h-28 shrink-0 rounded-[14px] overflow-hidden shadow-sm border border-[#E8E4DB]">
                        <img src={url} className="w-full h-full object-cover" alt="preview" />
                        <button onClick={(e) => { e.stopPropagation(); removeFile(idx); }} className="absolute top-1.5 right-1.5 bg-black/60 text-white rounded-full p-1"><X size={14} /></button>
                      </div>
                    );
                  })
                ) : albumForm.id ? (
                  <div className="relative w-full h-[180px] shrink-0 rounded-[14px] overflow-hidden shadow-sm border border-[#E8E4DB]">
                     <img src={albumForm.imageUrl} className="h-full w-full object-contain bg-[#FDFBF7]" alt="preview" />
                  </div>
                ) : null}
                
                {(!albumForm.id && (!albumForm.files || albumForm.files.length < 10)) && (
                  <div 
                    onClick={() => fileInputRef.current?.click()} 
                    className={`shrink-0 border-[1.5px] border-dashed border-[#C2BDB5] rounded-[14px] flex flex-col items-center justify-center cursor-pointer hover:bg-[#FDFBF7] transition-colors ${albumForm.files && albumForm.files.length > 0 ? 'w-28 h-28' : 'w-full h-[180px]'}`}
                  >
                    <CameraIcon size={albumForm.files && albumForm.files.length > 0 ? 28 : 44} className="text-[#8B7355] mb-2" strokeWidth={1.5} />
                    <p className="text-[#8A847E] font-sans text-[12px] text-center">추가</p>
                  </div>
                )}
              </div>

              <div className="flex gap-2 mb-6 justify-center">
                {['전체', '착용샷', '실물', '기타'].map(cat => (
                   <button key={cat} onClick={() => setAlbumForm({...albumForm, category: cat})} className={`flex-1 py-2.5 rounded-[8px] text-[13px] font-sans whitespace-nowrap transition-colors border shadow-sm ${albumForm.category === cat ? 'bg-[#8B7355] text-white border-[#8B7355] font-medium' : 'bg-white text-[#8A847E] border-[#E8E4DB]'}`}>
                     {cat}
                   </button>
                ))}
              </div>

              <div className="bg-white border border-[#E8E4DB] rounded-[14px] p-5 shadow-[0_2px_10px_rgba(0,0,0,0.02)] mb-8">
                <div className="flex flex-col py-3 border-b border-[#F2EFE8]">
                  <span className="text-[13px] text-[#2C2724] font-medium mb-1.5 ml-1">사진명</span>
                  <input type="text" value={albumForm.title} onChange={(e) => setAlbumForm({...albumForm, title: e.target.value})} className="bg-transparent outline-none text-[#4A443F] w-full text-sm px-1 py-1" placeholder="제목을 입력하세요" />
                </div>
                <div className="flex flex-col py-3 border-b border-[#F2EFE8]">
                  <span className="text-[13px] text-[#2C2724] font-medium mb-1.5 ml-1">REF.</span>
                  <input type="text" value={albumForm.ref} onChange={(e) => setAlbumForm({...albumForm, ref: e.target.value})} className="bg-transparent outline-none text-[#4A443F] w-full text-sm px-1 py-1" placeholder="레퍼런스 넘버 입력" />
                </div>
                <div className="flex flex-col pt-3 pb-1">
                  <span className="text-[13px] text-[#2C2724] font-medium mb-2 ml-1">메모</span>
                  <textarea value={albumForm.memo} onChange={(e) => setAlbumForm({...albumForm, memo: e.target.value})} className="bg-transparent outline-none text-[#4A443F] w-full text-sm resize-none h-[70px] px-1" placeholder="메모를 입력하세요"></textarea>
                </div>
              </div>
              
              {albumForm.id && (
                <button onClick={handleDeleteAlbum} className="w-full py-4 mt-2 mb-8 bg-white border border-[#E8D8D8] text-[#A06C6C] rounded-[14px] font-serif text-sm tracking-widest hover:bg-[#FFF5F5] transition-colors shadow-sm">
                  이 사진 삭제하기
                </button>
              )}
            </div>
          </div>
        );
      };

      const renderTaskModal = () => {
        if (!isTaskModalOpen || !taskForm) return null;
        const isExisting = tasks.some(t => t.id === taskForm.id);

        const handleSaveTask = async () => {
          if (!taskForm.title.trim()) { setAlertMessage("업무 내용을 입력해주세요."); return; }
          const payload = { ...taskForm };
          const targetId = payload.id;
          delete payload.id; 
          
          if (user.uid !== 'local-test-user') {
             if (isExisting && targetId) await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'tasks', targetId), payload);
             else await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'tasks'), { ...payload, isCompleted: false, isStarred: false });
          }
          setIsTaskModalOpen(false); setTaskForm(null);
        };

        const handleDeleteTask = async () => { 
           if (user.uid !== 'local-test-user') await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'tasks', taskForm.id));
           setIsTaskModalOpen(false); setTaskForm(null); 
        };

        return (
          <div className="absolute inset-0 bg-black/50 backdrop-blur-sm z-[100] flex flex-col justify-end">
            <div className="bg-[#FCFBF9] relative z-[101] rounded-t-3xl p-7 w-full animate-in slide-in-from-bottom-full duration-300 shadow-[0_-15px_40px_rgba(0,0,0,0.15)] border-t border-[#E8E4DB] max-h-[90vh] overflow-y-auto">
              <div className="flex justify-between items-center mb-7">
                <h3 className="text-xl font-serif tracking-widest text-[#3A3532]">{isExisting ? '업무 수정' : '새로운 업무'}</h3>
                <button onClick={() => setIsTaskModalOpen(false)} className="p-2 rounded-full hover:bg-[#F2EFE8] transition-colors"><X size={22} className="text-[#8A847E]" strokeWidth={1.5} /></button>
              </div>
              <div className="space-y-7">
                <div>
                  <label className="block text-[11px] font-medium tracking-widest text-[#8A847E] mb-2 uppercase font-sans">Date</label>
                  <input type="date" value={taskForm.date} onChange={(e) => setTaskForm({...taskForm, date: e.target.value})} className="w-full bg-transparent border-b border-[#DCD6CC] py-2 text-[#4A443F] focus:border-[#8B7355] outline-none transition-all font-serif text-sm" />
                </div>
                <div>
                  <label className="block text-[11px] font-medium tracking-widest text-[#8A847E] mb-3 uppercase font-sans">Category</label>
                  <div className="flex gap-2">
                    {TASK_CATEGORIES.map(cat => (
                      <button key={cat.id} onClick={() => setTaskForm({...taskForm, category: cat.label})} className={`px-4 py-2 rounded-[6px] text-[12px] font-sans transition-all ${taskForm.category === cat.label ? `${cat.badgeClass} font-bold shadow-sm` : 'bg-white text-[#8A847E] border border-[#E8E4DB] hover:bg-[#F2EFE8]'}`}>{cat.label}</button>
                    ))}
                  </div>
                </div>
                <div>
                  <label className="block text-[11px] font-medium tracking-widest text-[#8A847E] mb-2 uppercase font-sans">Title</label>
                  <input type="text" placeholder="업무 내용을 입력하세요" value={taskForm.title} onChange={(e) => setTaskForm({...taskForm, title: e.target.value})} className="w-full bg-transparent border-b border-[#DCD6CC] py-2 text-[#4A443F] placeholder-[#C2BDB5] focus:border-[#8B7355] outline-none transition-all font-sans text-sm font-medium" />
                </div>
                <div>
                  <label className="block text-[11px] font-medium tracking-widest text-[#8A847E] mb-2 uppercase font-sans">Memo</label>
                  <textarea rows="3" placeholder="상세 내용을 입력하세요" value={taskForm.memo} onChange={(e) => setTaskForm({...taskForm, memo: e.target.value})} className="w-full bg-white border border-[#E8E4DB] rounded-sm shadow-sm p-4 text-[#4A443F] placeholder-[#C2BDB5] focus:ring-1 focus:ring-[#8B7355] focus:border-[#8B7355] outline-none transition-all resize-none text-sm font-serif leading-relaxed"></textarea>
                </div>
                {isExisting ? (
                  <div className="flex gap-3 w-full mt-2">
                    <button onClick={handleSaveTask} className="flex-1 bg-[#3A3532] hover:bg-[#2A2522] text-[#F3EFE8] font-serif tracking-widest py-4 rounded-sm transition-colors shadow-lg text-sm border border-[#2A2522]">수정 완료</button>
                    <button onClick={handleDeleteTask} className="flex-1 bg-white hover:bg-[#FFF5F5] text-[#A06C6C] font-serif tracking-widest py-4 rounded-sm transition-colors border border-[#E8D8D8] text-sm shadow-sm">삭제</button>
                  </div>
                ) : (
                  <button onClick={handleSaveTask} className="w-full bg-[#3A3532] hover:bg-[#2A2522] text-[#F3EFE8] font-serif tracking-widest py-4 rounded-sm mt-2 transition-colors shadow-lg text-sm border border-[#2A2522]">저장하기</button>
                )}
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="w-full h-[100dvh] bg-[#DCD6CC] flex justify-center font-sans">
          <div 
             className="w-full h-full max-w-md bg-[#FCFBF9] shadow-[0_0_50px_rgba(0,0,0,0.15)] relative flex flex-col overflow-hidden"
             onClick={closeSwipe}
          >
            
            <div className="flex-1 relative flex flex-col overflow-hidden">
              {activeTab === 'customer' && renderCustomerTab()}
              {activeTab === 'inquiries' && renderInquiriesTab()}
              {activeTab === 'calendar' && renderCalendar()}
              {activeTab === 'album' && renderAlbumTab()}
              {activeTab === 'task' && renderTaskTab()}
            </div>

            <div className="w-full bg-[#FCFBF9] border-t border-[#E8E4DB] grid grid-cols-5 px-1 pb-[calc(env(safe-area-inset-bottom)+8px)] pt-3 shrink-0 z-30">
              <button onClick={() => setActiveTab('customer')} className={`flex flex-col items-center justify-start space-y-1 transition-colors relative ${activeTab === 'customer' ? 'text-[#8B7355]' : 'text-[#A8A29D] hover:text-[#7A746F]'}`}>
                {activeTab === 'customer' && <div className="absolute -top-3 w-12 h-[3px] bg-[#8B7355] rounded-b-md"></div>}
                <Users size={30} strokeWidth={activeTab === 'customer' ? 1.8 : 1.5} />
                <span className="text-[13px] font-serif tracking-widest mt-1">고객</span>
              </button>
              
              <button onClick={() => setActiveTab('inquiries')} className={`flex flex-col items-center justify-start space-y-1 transition-colors relative ${activeTab === 'inquiries' ? 'text-[#8B7355]' : 'text-[#A8A29D] hover:text-[#7A746F]'}`}>
                {activeTab === 'inquiries' && <div className="absolute -top-3 w-12 h-[3px] bg-[#8B7355] rounded-b-md"></div>}
                <MessageSquare size={30} strokeWidth={activeTab === 'inquiries' ? 1.8 : 1.5} />
                <span className="text-[13px] font-serif tracking-widest mt-1">문의사항</span>
              </button>
              
              <button onClick={() => setActiveTab('calendar')} className={`flex flex-col items-center justify-start space-y-1 transition-colors relative ${activeTab === 'calendar' ? 'text-[#8B7355]' : 'text-[#A8A29D] hover:text-[#7A746F]'}`}>
                {activeTab === 'calendar' && <div className="absolute -top-3 w-12 h-[3px] bg-[#8B7355] rounded-b-md"></div>}
                <CalendarDays size={30} strokeWidth={activeTab === 'calendar' ? 1.8 : 1.5} />
                <span className="text-[13px] font-serif tracking-widest mt-1">달력</span>
              </button>

              <button onClick={() => setActiveTab('album')} className={`flex flex-col items-center justify-start space-y-1 transition-colors relative ${activeTab === 'album' ? 'text-[#8B7355]' : 'text-[#A8A29D] hover:text-[#7A746F]'}`}>
                {activeTab === 'album' && <div className="absolute -top-3 w-12 h-[3px] bg-[#8B7355] rounded-b-md"></div>}
                <ImageIcon size={30} strokeWidth={activeTab === 'album' ? 1.8 : 1.5} />
                <span className="text-[13px] font-serif tracking-widest mt-1">앨범</span>
              </button>

              <button onClick={() => setActiveTab('task')} className={`flex flex-col items-center justify-start space-y-1 transition-colors relative ${activeTab === 'task' ? 'text-[#8B7355]' : 'text-[#A8A29D] hover:text-[#7A746F]'}`}>
                {activeTab === 'task' && <div className="absolute -top-3 w-12 h-[3px] bg-[#8B7355] rounded-b-md"></div>}
                <Briefcase size={30} strokeWidth={activeTab === 'task' ? 1.8 : 1.5} />
                <span className="text-[13px] font-serif tracking-widest mt-1">업무</span>
              </button>
            </div>

            {renderAddModal()}
            {renderViewModal()}
            {renderCustomerModal()}
            {renderInquiryModal()}
            {renderTaskModal()}
            {renderAlbumModal()}
            
            <CustomAlert message={alertMessage} onClose={() => setAlertMessage('')} />
            <CustomConfirm message={confirmDialog.message} onConfirm={confirmDialog.onConfirm} onClose={() => setConfirmDialog({...confirmDialog, isOpen: false})} />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<WorkApp />);
  </script>
</body>
</html>
