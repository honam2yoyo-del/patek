    const compressImage = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const MAX_WIDTH = 1000;
            const MAX_HEIGHT = 1000;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
          img.onerror = (error) => reject(error);
        };
        reader.onerror = (error) => reject(error);
      });
    };

        if (!auth) return;
        
        getRedirectResult(auth).then((result) => {
          if (result && result.user) {
            setUser(result.user);
            setIsLoggedIn(true);
            setIsLoading(false);
          }
        }).catch((err) => {
          console.error("Redirect Error:", err);
          setIsLoading(false);
        });

        const unsubscribe = onAuthStateChanged(auth, (u) => {
          if (u) {
            setUser(u);
            setIsLoggedIn(true);
            setIsLoading(false);
          } else {
            setUser(null);
            setIsLoggedIn(false);
            setIsLoading(false);
          }
        });
        return () => unsubscribe();
      }, []);

      const handleLogin = async () => {
        if (!auth) {
           setAlertMessage("Firebase DB 오류: 인증 정보를 확인할 수 없습니다.");
           return;
        }
        
        setIsLoading(true);
        try {
          const provider = new GoogleAuthProvider();
          const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
          const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

          if (isMobile || isPWA) {
            await signInWithRedirect(auth, provider);
          } else {
            await signInWithPopup(auth, provider);
          }
        } catch (err) {
          console.error("Google Login Error:", err);
          
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
          } else {
              await signInAnonymously(auth);
          }
        }
      };

      useEffect(() => {
        if (!user || !isLoggedIn || !db || user.uid === 'local-test-user') return;
        const uId = user.uid;

        const unsubEvents = onSnapshot(collection(db, 'artifacts', appId, 'users', uId, 'events'), snap => {
          setEvents(snap.docs.map(d => ({id: d.id, ...d.data()})));
        });
        const unsubCustomers = onSnapshot(collection(db, 'artifacts', appId, 'users', uId, 'customers'), snap => {
          setCustomers(snap.docs.map(d => ({id: d.id, ...d.data()})));
        });
        const unsubInquiries = onSnapshot(collection(db, 'artifacts', appId, 'users', uId, 'inquiries'), snap => {
          setInquiries(snap.docs.map(d => ({id: d.id, ...d.data()})));
        });
        const unsubTasks = onSnapshot(collection(db, 'artifacts', appId, 'users', uId, 'tasks'), snap => {
          setTasks(snap.docs.map(d => ({id: d.id, ...d.data()})));
        });
        const unsubAlbums = onSnapshot(collection(db, 'artifacts', appId, 'users', uId, 'albums'), snap => {
          setAlbums(snap.docs.map(d => ({id: d.id, ...d.data()})));
        });

        return () => { unsubEvents(); unsubCustomers(); unsubInquiries(); unsubTasks(); unsubAlbums(); };
      }, [user, isLoggedIn]);

      const handleTouchStartItem = (e) => {
        touchState.current.startX = e.touches[0].clientX;
        touchState.current.startY = e.touches[0].clientY;
        touchState.current.isScrolling = false;
      };

      const handleTouchMoveItem = (e, id) => {
        if (!touchState.current.startX) return;
        const currentX = e.touches[0].clientX;
        const currentY = e.touches[0].clientY;
        const diffX = touchState.current.startX - currentX;
        const diffY = Math.abs(touchState.current.startY - currentY);

        if (diffY > 20) {
          touchState.current.isScrolling = true;
          return;
        }

        if (!touchState.current.isScrolling) {
          if (diffX > 40) {
            setSwipedItemId(id);
          } else if (diffX < -40 && swipedItemId === id) {
            setSwipedItemId(null);
          }
        }
      };

      const closeSwipe = () => {
        if (swipedItemId) setSwipedItemId(null);
      };

      const getDaysInMonthFunc = (year, month) => new Date(year, month + 1, 0).getDate();
      const getFirstDayOfMonthFunc = (year, month) => new Date(year, month, 1).getDay();
      const prevMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));
      const nextMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
      
      const handleDayClick = (dateStr) => {
        setFormData({ id: '', date: dateStr, endDate: '', title: '', content: '', categoryId: 'yellow' });
        setIsMultiDay(false);
        setIsAddModalOpen(true);
      };

      const handleFileChange = (e) => {
        const newFiles = Array.from(e.target.files);
        const existingFiles = albumForm.files || [];
        const totalFiles = [...existingFiles, ...newFiles];
        if (totalFiles.length > 10) {
          setAlertMessage("최대 10장까지만 업로드 가능합니다.");
          setAlbumForm({ ...albumForm, files: totalFiles.slice(0, 10) });
        } else {
          setAlbumForm({ ...albumForm, files: totalFiles });
        }
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      const removeFile = (index) => {
        const newFiles = [...albumForm.files];
        newFiles.splice(index, 1);
        setAlbumForm({ ...albumForm, files: newFiles });
      };

      const handleSaveAlbum = async () => {
        if (!user || !db) { setAlertMessage("로그인 후 이용 가능합니다."); return; }
        
        if (albumForm.id) {
           if (!albumForm.title.trim()) { setAlertMessage("사진명(제목)을 입력해주세요."); return; }
           let newImageUrl = albumForm.imageUrl;
           if (albumForm.files && albumForm.files.length > 0) newImageUrl = await compressImage(albumForm.files[0]);
           
           if (user.uid !== 'local-test-user') {
             await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'albums', albumForm.id), {
                category: albumForm.category === '전체' ? '기타' : albumForm.category,
                title: albumForm.title, ref: albumForm.ref, memo: albumForm.memo, imageUrl: newImageUrl
             });
           }
           setIsAlbumModalOpen(false); setAlbumForm(null); setAlertMessage("사진이 수정되었습니다.");
           return;
        }

        if (!albumForm.files || albumForm.files.length === 0) { setAlertMessage("사진을 선택해주세요."); return; }
        if (!albumForm.title.trim()) { setAlertMessage("사진명(제목)을 입력해주세요."); return; }
        
        setAlertMessage("사진을 저장 중입니다...\n잠시만 기다려주세요.");
        
        try {
          const promises = albumForm.files.map(async (file) => {
            const base64Url = await compressImage(file);
            const payload = {
              imageUrl: base64Url, category: albumForm.category === '전체' ? '기타' : albumForm.category,
              title: albumForm.title, ref: albumForm.ref, memo: albumForm.memo, date: new Date().toISOString().split('T')[0]
            };
            if (user.uid !== 'local-test-user') await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'albums'), payload);
          });
          await Promise.all(promises);
          setIsAlbumModalOpen(false); setAlbumForm(null);
          setAlertMessage(`${albumForm.files.length}장의 사진이 성공적으로 저장되었습니다.`);
        } catch(e) {
          setAlertMessage("저장 중 오류가 발생했습니다.");
        }
      };

      const toggleAlbumSelection = (id) => {
        if (selectedAlbumIds.includes(id)) setSelectedAlbumIds(selectedAlbumIds.filter(v => v !== id));
        else setSelectedAlbumIds([...selectedAlbumIds, id]);
      };

      const handleShareOrSave = async () => {
        if (selectedAlbumIds.length === 0) return;
        
        try {
          const filesArray = [];
          for (const id of selectedAlbumIds) {
             const album = albums.find(a => a.id === id);
             if (album && album.imageUrl) {
               const file = await base64ToFile(album.imageUrl, `patek_${id}.jpg`);
               filesArray.push(file);
             }
          }
          
          if (navigator.canShare && navigator.canShare({ files: filesArray })) {
             await navigator.share({
               files: filesArray
             });
             setSelectedAlbumIds([]);
          } else {
             throw new Error("공유/저장을 지원하지 않는 브라우저입니다.");
          }
        } catch (error) {
          if (error.name === 'AbortError' || (error.message && error.message.includes('canceled'))) {
             return;
          }
          console.log("Share API error:", error);
          
          selectedAlbumIds.forEach(id => {
            const album = albums.find(a => a.id === id);
            if (album) {
               const link = document.createElement('a');
               link.href = album.imageUrl;
               link.download = `patek_${id}.jpg`;
               document.body.appendChild(link);
               link.click();
               document.body.removeChild(link);
            }
          });
          setAlertMessage(`기본 다운로드 방식으로 사진을 저장했습니다.\n(갤러리 또는 파일 앱 확인)`);
          setSelectedAlbumIds([]);
        }
      };

      const handleDeleteAlbum = () => {
        setConfirmDialog({
           isOpen: true,
           message: "이 사진을 삭제하시겠습니까?",
           onConfirm: async () => {
              if (user && db && user.uid !== 'local-test-user') {
                 await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'albums', albumForm.id));
              }
              setIsAlbumModalOpen(false); setAlbumForm(null);
              setConfirmDialog({ isOpen: false, message: '', onConfirm: null });
           }
        });
      };

      const handleSaveEvent = async () => {
        if (!formData.title.trim() || !formData.date) { setAlertMessage("일정 제목과 날짜를 확인해주세요."); return; }
        if (!user || !db) return;

        const eventData = { 
           date: formData.date, 
           endDate: isMultiDay && formData.endDate && formData.endDate >= formData.date ? formData.endDate : null, 
           title: formData.title, content: formData.content, categoryId: formData.categoryId,
           updatedAt: new Date().toISOString() 
        };
        
        if (user.uid !== 'local-test-user') {
          if (formData.id) await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'events', formData.id), eventData);
          else await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'events'), eventData);
        }
        
        setIsAddModalOpen(false); setIsMultiDay(false);
        setFormData({ id: '', date: new Date().toISOString().split('T')[0], endDate: '', title: '', content: '', categoryId: 'yellow' });
      };

      if (!isLoggedIn) {
        return (
          <div className="w-full h-screen bg-[#DCD6CC] flex justify-center font-sans">
             <div className="w-full h-full max-w-md bg-[#FCFBF9] shadow-[0_0_50px_rgba(0,0,0,0.15)] flex flex-col items-center justify-center font-serif relative px-6">
                <img src="./logo.png" alt="Patek Philippe" className="w-24 h-24 mb-6 object-contain" />
                <h1 className="text-3xl font-serif text-[#3A3532] tracking-widest mb-16 text-center leading-snug">PATEK PHILIPPE</h1>
                <button 
                  onClick={handleLogin} 
                  disabled={isLoading}
                  className={`flex items-center gap-4 bg-white border border-[#E8E4DB] px-6 py-3.5 rounded-full shadow-[0_4px_15px_rgba(0,0,0,0.05)] transition-all active:scale-95 w-full justify-center ${isLoading ? 'opacity-50 cursor-not-allowed' : 'hover:bg-[#F2EFE8]'}`}
                >
                  <GoogleIcon size={20} />
                  <span className="font-sans text-[14px] font-medium text-[#4A443F]">{isLoading ? '로그인 중...' : 'Google 계정으로 시작하기'}</span>
                </button>
             </div>
             <CustomAlert message={alertMessage} onClose={() => setAlertMessage('')} />
          </div>
        );
      }

      const renderCalendar = () => {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const firstDay = getFirstDayOfMonthFunc(year, month);
        const daysInMonth = getDaysInMonthFunc(year, month);
        const prevMonthDays = new Date(year, month, 0).getDate();

        const weekDates = [];
        for (let i = 0; i < firstDay; i++) {
          const y = month === 0 ? year - 1 : year; const m = month === 0 ? 12 : month; const d = prevMonthDays - firstDay + i + 1;
          weekDates.push(`${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
        }
        for (let day = 1; day <= daysInMonth; day++) weekDates.push(`${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`);
        let nextMonthDay = 1;
        while (weekDates.length % 7 !== 0) {
          const y = month === 11 ? year + 1 : year; const m = month === 11 ? 1 : month + 2;
          weekDates.push(`${y}-${String(m).padStart(2, '0')}-${String(nextMonthDay).padStart(2, '0')}`); nextMonthDay++;
        }
        const calendarWeeks = [];
        for(let i = 0; i < weekDates.length; i += 7) calendarWeeks.push(weekDates.slice(i, i + 7));

        return (
          <div className="flex flex-col h-full bg-[#FCFBF9] relative font-serif" onClick={closeSwipe}>
            <div className="flex flex-col items-center justify-center pt-[calc(env(safe-area-inset-top)+16px)] pb-4 relative z-20 shrink-0">
              <a href="https://www.patek.com/en" target="_blank" rel="noopener noreferrer">
                 <img src="./logo.png" alt="Brand Logo" className="w-16 h-16 mb-5 object-contain hover:opacity-100 transition-opacity cursor-pointer" />
              </a>
              <div className="flex items-center justify-between w-full max-w-[300px]">
                <button onClick={prevMonth} className="p-2 text-[#C2BDB5] hover:text-[#8A847E] transition-colors"><ChevronLeft size={24} strokeWidth={1} /></button>
                <div className="flex items-center justify-center gap-1 text-2xl sm:text-3xl font-serif text-[#3A3532] tracking-wider relative z-30">
                  <select value={year} onChange={(e) => setCurrentDate(new Date(parseInt(e.target.value), month, 1))} className="appearance-none bg-transparent cursor-pointer outline-none text-right hover:text-[#8B7355] transition-colors pb-1">
                    {Array.from({ length: 30 }, (_, i) => 2020 + i).map(y => <option key={y} value={y}>{y}년</option>)}
                  </select>
                  <select value={month} onChange={(e) => setCurrentDate(new Date(year, parseInt(e.target.value), 1))} className="appearance-none bg-transparent cursor-pointer outline-none text-left hover:text-[#8B7355] transition-colors pb-1">
                    {Array.from({ length: 12 }, (_, i) => i).map(m => <option key={m} value={m}>{m + 1}월</option>)}
                  </select>
                </div>
                <button onClick={nextMonth} className="p-2 text-[#C2BDB5] hover:text-[#8A847E] transition-colors"><ChevronRight size={24} strokeWidth={1} /></button>
              </div>
            </div>

            <div className="flex-1 flex flex-col relative z-0 overflow-hidden">
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-0 overflow-hidden pb-10">
                <img src="./logo.png" alt="Watermark Logo" className="w-[400px] h-[400px] opacity-[0.05] object-contain grayscale" />
              </div>
              <div className="grid grid-cols-7 relative z-10 border-y border-[#E8E4DB] mx-5 shrink-0 bg-[#FCFBF9]">
                {['일', '월', '화', '수', '목', '금', '토'].map((day, idx) => <div key={day} className={`py-4 text-center text-[13px] tracking-widest font-serif ${idx === 0 ? 'text-[#A06C6C]' : 'text-[#6B635C]'}`}>{day}</div>)}
              </div>
              
              <div className="flex-1 overflow-y-auto px-5 pb-8 no-scrollbar relative z-0">
                {calendarWeeks.map((wDates, wIdx) => {
                  let weekEvents = events.filter(e => { const eStart = e.date; const eEnd = e.endDate || e.date; return eStart <= wDates[6] && eEnd >= wDates[0]; });
                  weekEvents.sort((a, b) => { if (a.date !== b.date) return a.date.localeCompare(b.date); const aDur = new Date(a.endDate || a.date) - new Date(a.date); const bDur = new Date(b.endDate || b.date) - new Date(b.date); return bDur - aDur; });
                  const slots = []; const eventSlots = {};
                  weekEvents.forEach(e => {
                    const eStart = e.date; const eEnd = e.endDate || e.date; 
                    for (let slotIdx = 0; slotIdx < 10; slotIdx++) { 
                      if (!slots[slotIdx]) slots[slotIdx] = []; let isFree = true;
                      const effectiveStart = eStart < wDates[0] ? wDates[0] : eStart; const effectiveEnd = eEnd > wDates[6] ? wDates[6] : eEnd;
                      for (let currStr = effectiveStart; currStr <= effectiveEnd; currStr = getNextDayStr(currStr)) { if (slots[slotIdx].includes(currStr)) { isFree = false; break; } }
                      if (isFree) { for (let currStr = effectiveStart; currStr <= effectiveEnd; currStr = getNextDayStr(currStr)) { slots[slotIdx].push(currStr); } eventSlots[e.id] = slotIdx; break; }
                    }
                  });
                  const maxSlots = Math.max(slots.length, 0);

                  return (
                    <div key={wIdx} className="relative min-h-[96px]">
                       <div className="absolute inset-0 grid grid-cols-7 z-0">
                          {wDates.map((dateStr) => <div key={`bg-${dateStr}`} onClick={() => handleDayClick(dateStr)} className="cursor-pointer hover:bg-[#F2EFE8]/50 transition-colors" />)}
                       </div>
                       <div className="absolute bottom-0 w-full border-b border-[#E8E4DB]" />
                       <div className="relative z-10 flex flex-col pointer-events-none pb-2 pt-2">
                          <div className="grid grid-cols-7">
                             {wDates.map((dateStr, dIdx) => {
                                const day = parseInt(dateStr.split('-')[2], 10); const isCurrentMonth = dateStr.startsWith(`${year}-${String(month + 1).padStart(2, '0')}`);
                                let textColor = 'text-[#6B635C]'; if (!isCurrentMonth) textColor = 'text-[#DCD6CC]'; else if (dIdx === 0) textColor = 'text-[#A06C6C]';
                                return (<div key={`header-${dateStr}`} className="px-1.5 pb-1 flex justify-start"><span className={`text-[13px] font-serif ml-0.5 pointer-events-auto cursor-pointer ${textColor} hover:font-bold`} onClick={() => handleDayClick(dateStr)}>{day}</span></div>);
                             })}
                          </div>
                          <div className="flex flex-col gap-[3px] mt-1 relative w-full">
                             {Array.from({length: maxSlots}).map((_, sIdx) => {
                                const eventsInSlot = weekEvents.filter(e => eventSlots[e.id] === sIdx);
                                if (eventsInSlot.length === 0) return <div key={`empty-${wIdx}-${sIdx}`} className="h-[22px]" />;
                                return (
                                   <div key={`slot-${wIdx}-${sIdx}`} className="relative h-[22px] w-full">
                                      {eventsInSlot.map(event => {
                                         const category = CATEGORIES.find(c => c.id === event.categoryId) || CATEGORIES[0];
                                         const eStart = event.date; const eEnd = event.endDate || event.date;
                                         const isActualStart = eStart >= wDates[0]; const isActualEnd = eEnd <= wDates[6];
                                         const effectiveStart = eStart < wDates[0] ? wDates[0] : eStart; const effectiveEnd = eEnd > wDates[6] ? wDates[6] : eEnd;
                                         const startIdx = wDates.findIndex(d => d === effectiveStart); const endIdx = wDates.findIndex(d => d === effectiveEnd);
                                         const span = endIdx - startIdx + 1;
                                         return (
                                            <div key={event.id} className="absolute h-full pointer-events-auto" style={{ left: `${(startIdx / 7) * 100}%`, width: `${(span / 7) * 100}%`, paddingLeft: isActualStart ? '4px' : '0px', paddingRight: isActualEnd ? '4px' : '0px' }} onClick={(e) => { e.stopPropagation(); setSelectedEvent({ ...event, category }); setIsViewModalOpen(true); }}>
                                               <div className={`h-full w-full flex items-center px-1.5 shadow-[0_1px_2px_rgba(0,0,0,0.05)] overflow-hidden cursor-pointer hover:brightness-95 transition-all ${isActualStart ? 'rounded-[3px] border-l' : 'border-l-0 rounded-l-none'} ${isActualEnd ? 'rounded-[3px] border-r' : 'border-r-0 rounded-r-none'} border-y ${category.color} ${category.textColor} ${category.border}`}>
                                                  <span className="text-[10px] tracking-tight leading-none truncate w-full font-sans font-medium">{event.title}</span>
                                               </div>
                                            </div>
                                         );
                                      })}
                                   </div>
                                );
                             })}
                          </div>
                       </div>
                    </div>
                  );
                })}
              </div>
            </div>
            
            <button onClick={() => { setFormData({ id: '', date: new Date().toISOString().split('T')[0], endDate: '', title: '', content: '', categoryId: 'yellow' }); setIsAddModalOpen(true); }} className="absolute bottom-[24px] right-6 w-14 h-14 bg-[#3A3532] text-[#F3EFE8] rounded-full flex items-center justify-center shadow-[0_8px_20px_rgba(58,53,50,0.3)] transition-transform active:scale-95 z-40 border border-[#2A2522]">
              <Plus size={26} strokeWidth={1.2} />
            </button>
          </div>
        );
      };

      const renderCustomerTab = () => {
        const safeQuery = String(searchQuery || '').toLowerCase().replace(/[\s-]/g, '');
        
        const filteredAndSorted = [...customers].filter(c => {
            if (!safeQuery) return true;
            const matchName = String(c.name || '').toLowerCase().replace(/[\s-]/g, '').includes(safeQuery);
            const matchRef = c.purchases && c.purchases.some(p => String(p.ref || '').toLowerCase().replace(/[\s-]/g, '').includes(safeQuery));
            return matchName || matchRef;
        }).sort((a, b) => {
            const aQty = a.purchases.reduce((sum, p) => sum + (Number(p.qty) || 0), 0);
            const aAmt = a.purchases.reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
            const bQty = b.purchases.reduce((sum, p) => sum + (Number(p.qty) || 0), 0);
            const bAmt = b.purchases.reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
            if (sortOrder === 'amount_desc') return bAmt - aAmt;
            if (sortOrder === 'amount_asc') return aAmt - bAmt;
            if (sortOrder === 'qty_desc') return bQty - aQty;
            if (sortOrder === 'qty_asc') return aQty - bQty; return 0;
        });

        const handleDeleteCustomer = (e, id) => {
          e.stopPropagation();
          setConfirmDialog({
            isOpen: true,
            message: "해당 고객을 삭제하시겠습니까?",
            onConfirm: async () => {
              if (user.uid !== 'local-test-user') await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'customers', id));
              setSwipedItemId(null);
              setConfirmDialog({ isOpen: false, message: '', onConfirm: null });
            }
          });
        };

        return (
          <div className="flex flex-col h-full bg-[#FCFBF9] font-serif relative" onClick={closeSwipe}>
            <div className="flex flex-col items-center pt-[calc(env(safe-area-inset-top)+16px)] pb-4 relative z-20 shrink-0">
              <a href="https://www.patek.com/en" target="_blank" rel="noopener noreferrer">
                <img src="./logo.png" alt="Patek Philippe" className="w-16 h-16 mb-3 object-contain cursor-pointer" />
              </a>
              <h2 className="text-3xl font-serif text-[#3A3532] tracking-wider mb-5">Customer List</h2>
              
              <div className="w-full px-5 flex gap-2 relative">
                <div className="flex-1 bg-white border border-[#E8E4DB] rounded-[6px] px-3 py-3 flex items-center shadow-sm">
                  <Search size={20} className="text-[#8A847E] mr-2" />
                  <input type="text" placeholder="고객명 또는 REF 검색" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="flex-1 bg-transparent outline-none font-sans text-sm text-[#4A443F] placeholder-[#C2BDB5]" />
                </div>
                <button onClick={() => setIsFilterOpen(!isFilterOpen)} className="bg-white border border-[#E8E4DB] rounded-[6px] px-4 py-3 shadow-sm hover:bg-[#F2EFE8] transition-colors flex items-center justify-center text-[#4A443F]">
                  <Filter size={20} />
                </button>
                {isFilterOpen && (
                  <div className="absolute right-5 top-[56px] w-48 bg-white border border-[#E8E4DB] rounded-[6px] shadow-lg z-30 font-sans text-sm overflow-hidden animate-in fade-in slide-in-from-top-2">
                    <div className="px-4 py-2 bg-[#F2EFE8] text-[#8A847E] font-medium text-[11px] uppercase tracking-widest">정렬 기준</div>
                    <button onClick={() => { setSortOrder('amount_desc'); setIsFilterOpen(false); }} className={`w-full text-left px-4 py-3 hover:bg-[#FDFBF7] ${sortOrder === 'amount_desc' ? 'font-bold text-[#8B7355]' : 'text-[#4A443F]'}`}>금액 높은 순</button>
                    <button onClick={() => { setSortOrder('amount_asc'); setIsFilterOpen(false); }} className={`w-full text-left px-4 py-3 hover:bg-[#FDFBF7] border-t border-[#F2EFE8] ${sortOrder === 'amount_asc' ? 'font-bold text-[#8B7355]' : 'text-[#4A443F]'}`}>금액 낮은 순</button>
                    <button onClick={() => { setSortOrder('qty_desc'); setIsFilterOpen(false); }} className={`w-full text-left px-4 py-3 hover:bg-[#FDFBF7] border-t border-[#F2EFE8] ${sortOrder === 'qty_desc' ? 'font-bold text-[#8B7355]' : 'text-[#4A443F]'}`}>수량 많은 순</button>
                    <button onClick={() => { setSortOrder('qty_asc'); setIsFilterOpen(false); }} className={`w-full text-left px-4 py-3 hover:bg-[#FDFBF7] border-t border-[#F2EFE8] ${sortOrder === 'qty_asc' ? 'font-bold text-[#8B7355]' : 'text-[#4A443F]'}`}>수량 적은 순</button>
                  </div>
                )}
              </div>
            </div>

            <div className="grid grid-cols-[1.5fr_1fr_1.5fr] px-5 py-3 border-b border-[#E8E4DB] text-[12px] font-sans text-[#8A847E] shrink-0">
              <div className="text-center pl-6">Name</div>
              <div className="text-center">Qty</div>
              <div className="text-center pr-2">Amount</div>
            </div>

            <div className="flex-1 overflow-y-auto overflow-x-hidden no-scrollbar pb-8 relative">
              {filteredAndSorted.map(customer => {
                const totalQty = customer.purchases.reduce((sum, p) => sum + (Number(p.qty) || 0), 0);
                const totalAmount = customer.purchases.reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
                const isSwiped = swipedItemId === customer.id;

                return (
                  <div key={customer.id} className="relative bg-white border-b border-[#F2EFE8] overflow-hidden">
                    <div className="absolute right-0 top-0 bottom-0 w-[80px] bg-[#FF3B30] flex flex-col items-center justify-center text-white cursor-pointer shadow-inner" onClick={(e) => handleDeleteCustomer(e, customer.id)}>
                      <Trash2 size={24} />
                      <span className="text-[11px] font-sans font-medium mt-1">삭제</span>
                    </div>
                    <div 
                      className="grid grid-cols-[1.5fr_1fr_1.5fr] px-5 py-4 bg-white items-center cursor-pointer hover:bg-[#FDFBF7] transition-transform duration-300 ease-out"
                      style={{ transform: isSwiped ? 'translateX(-80px)' : 'translateX(0px)' }}
                      onTouchStart={(e) => handleTouchStartItem(e, customer.id)}
                      onTouchMove={(e) => handleTouchMoveItem(e, customer.id)}
                      onClick={(e) => {
                         if(swipedItemId) { e.stopPropagation(); setSwipedItemId(null); }
                         else { setCustomerForm(JSON.parse(JSON.stringify(customer))); setIsCustomerModalOpen(true); }
                      }}
                    >
                      <div className="flex items-center justify-center gap-2 w-full pl-2 pointer-events-none">
                        <div className="w-7 h-7 rounded-full border border-[#DCD6CC] bg-[#FCFBF9] flex items-center justify-center text-[#8A847E] shrink-0"><Users size={14} /></div>
                        <span className="font-sans font-medium text-[#2C2724] text-sm truncate w-[60px] text-center">{customer.name}</span>
                      </div>
                      <div className="text-center font-sans text-[#6B635C] text-[13px] pointer-events-none">{totalQty}PCS</div>
                      <div className="text-center font-serif text-[#3A3532] text-[14px] pointer-events-none">₩{totalAmount.toLocaleString()}</div>
                    </div>
                  </div>
                );
              })}
              {filteredAndSorted.length === 0 && <div className="flex justify-center items-center h-32 text-[#A8A29D] font-serif">검색된 고객이 없습니다.</div>}
            </div>

            <button onClick={() => { setCustomerForm({ id: '', name: '', birthDate: '', phone: '', job: '', notes: '', purchases: [] }); setIsCustomerModalOpen(true); }} className="absolute bottom-[24px] right-6 w-14 h-14 bg-[#3A3532] text-[#F3EFE8] rounded-full flex items-center justify-center shadow-[0_8px_20px_rgba(58,53,50,0.3)] transition-transform active:scale-95 z-40 border border-[#2A2522]">
              <Plus size={26} strokeWidth={1.2} />
            </button>
          </div>
        );
      };

      const renderInquiriesTab = () => {
        const safeQuery = String(inquirySearchQuery || '').toLowerCase().replace(/[\s-]/g, '');
        
        let filteredInquiries = [...inquiries].filter(i => {
            if (!safeQuery) return true;
            const matchName = String(i.customerName || '').toLowerCase().replace(/[\s-]/g, '').includes(safeQuery);
            const matchRef = i.items && i.items.some(item => String(item.ref || '').toLowerCase().replace(/[\s-]/g, '').includes(safeQuery));
            return matchName || matchRef;
        });
        
        if (inquirySortOrder === 'filter_old') filteredInquiries = filteredInquiries.filter(i => i.type === '기존');
        else if (inquirySortOrder === 'filter_new') filteredInquiries = filteredInquiries.filter(i => i.type === '신규');
        else if (inquirySortOrder === 'date_desc') filteredInquiries.sort((a, b) => b.date.localeCompare(a.date));
        else if (inquirySortOrder === 'name_asc') filteredInquiries.sort((a, b) => a.customerName.localeCompare(b.customerName));

        const handleDeleteInquiry = (e, id) => {
          e.stopPropagation();
          setConfirmDialog({
            isOpen: true,
            message: "해당 문의사항을 삭제하시겠습니까?",
            onConfirm: async () => {
              if (user.uid !== 'local-test-user') await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'inquiries', id));
              setSwipedItemId(null);
              setConfirmDialog({ isOpen: false, message: '', onConfirm: null });
            }
          });
        };

        return (
          <div className="flex flex-col h-full bg-[#FCFBF9] font-serif relative" onClick={closeSwipe}>
            <div className="flex flex-col items-center pt-[calc(env(safe-area-inset-top)+16px)] pb-4 relative z-20 shrink-0">
              <a href="https://www.patek.com/en" target="_blank" rel="noopener noreferrer">
                <img src="./logo.png" alt="Patek Philippe" className="w-16 h-16 mb-3 object-contain cursor-pointer" />
              </a>
              <h2 className="text-3xl font-serif text-[#3A3532] tracking-wider mb-5">Wish List</h2>
              
              <div className="w-full px-5 flex gap-2 relative">
                <div className="flex-1 bg-white border border-[#E8E4DB] rounded-[6px] px-3 py-3 flex items-center shadow-sm">
                  <Search size={20} className="text-[#8A847E] mr-2" />
                  <input type="text" placeholder="고객명 또는 REF 검색" value={inquirySearchQuery} onChange={(e) => setInquirySearchQuery(e.target.value)} className="flex-1 bg-transparent outline-none font-sans text-sm text-[#4A443F] placeholder-[#C2BDB5]" />
                </div>
                <button onClick={() => setIsInquiryFilterOpen(!isInquiryFilterOpen)} className="bg-white border border-[#E8E4DB] rounded-[6px] px-4 py-3 shadow-sm hover:bg-[#F2EFE8] transition-colors flex items-center justify-center text-[#4A443F]">
                  <Filter size={20} />
                </button>
                {isInquiryFilterOpen && (
                  <div className="absolute right-5 top-[56px] w-48 bg-white border border-[#E8E4DB] rounded-[6px] shadow-lg z-30 font-sans text-sm overflow-hidden animate-in fade-in slide-in-from-top-2">
                    <div className="px-4 py-2 bg-[#F2EFE8] text-[#8A847E] font-medium text-[11px] uppercase tracking-widest">정렬/필터</div>
                    <button onClick={() => { setInquirySortOrder('date_desc'); setIsInquiryFilterOpen(false); }} className={`w-full text-left px-4 py-3 hover:bg-[#FDFBF7] ${inquirySortOrder === 'date_desc' ? 'font-bold text-[#8B7355]' : 'text-[#4A443F]'}`}>날짜순</button>
                    <button onClick={() => { setInquirySortOrder('name_asc'); setIsInquiryFilterOpen(false); }} className={`w-full text-left px-4 py-3 hover:bg-[#FDFBF7] border-t border-[#F2EFE8] ${inquirySortOrder === 'name_asc' ? 'font-bold text-[#8B7355]' : 'text-[#4A443F]'}`}>이름순</button>
                    <button onClick={() => { setInquirySortOrder('filter_old'); setIsInquiryFilterOpen(false); }} className={`w-full text-left px-4 py-3 hover:bg-[#FDFBF7] border-t border-[#F2EFE8] ${inquirySortOrder === 'filter_old' ? 'font-bold text-[#8B7355]' : 'text-[#4A443F]'}`}>기존 보기</button>
                    <button onClick={() => { setInquirySortOrder('filter_new'); setIsInquiryFilterOpen(false); }} className={`w-full text-left px-4 py-3 hover:bg-[#FDFBF7] border-t border-[#F2EFE8] ${inquirySortOrder === 'filter_new' ? 'font-bold text-[#8B7355]' : 'text-[#4A443F]'}`}>신규 보기</button>
                  </div>
                )}
              </div>
            </div>

            <div className="grid grid-cols-[1.2fr_1fr_1fr] px-5 py-3 border-b border-[#E8E4DB] text-[12px] font-sans text-[#8A847E] shrink-0">
              <div className="text-center">Date</div>
              <div className="text-center">Name</div>
              <div className="text-center">Type</div>
            </div>

            <div className="flex-1 overflow-y-auto overflow-x-hidden no-scrollbar pb-8 relative">
              {filteredInquiries.map(inquiry => {
                const isSwiped = swipedItemId === inquiry.id;
                return (
                  <div key={inquiry.id} className="relative bg-white border-b border-[#F2EFE8] overflow-hidden">
                     <div className="absolute right-0 top-0 bottom-0 w-[80px] bg-[#FF3B30] flex flex-col items-center justify-center text-white cursor-pointer shadow-inner" onClick={(e) => handleDeleteInquiry(e, inquiry.id)}>
                        <Trash2 size={24} />
                        <span className="text-[11px] font-sans font-medium mt-1">삭제</span>
                     </div>
                     <div 
                        className="grid grid-cols-[1.2fr_1fr_1fr] px-5 py-4 bg-white items-center cursor-pointer hover:bg-[#FDFBF7] transition-transform duration-300 ease-out"
                        style={{ transform: isSwiped ? 'translateX(-80px)' : 'translateX(0px)' }}
                        onTouchStart={(e) => handleTouchStartItem(e, inquiry.id)}
                        onTouchMove={(e) => handleTouchMoveItem(e, inquiry.id)}
                        onClick={(e) => {
                           if(swipedItemId) { e.stopPropagation(); setSwipedItemId(null); }
                           else { setInquiryForm(JSON.parse(JSON.stringify(inquiry))); setIsInquiryModalOpen(true); }
                        }}
                     >
                        <div className="text-center font-sans text-[#6B635C] text-[13px] pointer-events-none">{inquiry.date}</div>
                        <div className="text-center font-sans font-medium text-[#2C2724] text-[14px] pointer-events-none">{inquiry.customerName}</div>
                        <div className="text-center font-sans text-[#6B635C] text-[13px] pointer-events-none">{inquiry.type}</div>
                     </div>
                  </div>
                );
              })}
              {filteredInquiries.length === 0 && <div className="flex justify-center items-center h-32 text-[#A8A29D] font-serif">검색된 정보가 없습니다.</div>}
            </div>

            <button onClick={() => { 
                const todayFormatted = new Date().toISOString().split('T')[0].replace(/-/g, '.');
                setInquiryForm({ id: '', date: todayFormatted, type: '신규', customerName: '', birthDate: '', customerPhone: '', job: '', notes: '', memo: '', items: [] }); 
                setIsInquiryModalOpen(true); 
              }} 
              className="absolute bottom-[24px] right-6 w-14 h-14 bg-[#3A3532] text-[#F3EFE8] rounded-full flex items-center justify-center shadow-[0_8px_20px_rgba(58,53,50,0.3)] transition-transform active:scale-95 z-40 border border-[#2A2522]">
              <Plus size={26} strokeWidth={1.2} />
            </button>
          </div>
        );
      };

      const renderAlbumTab = () => {
        let filteredAlbums = albums.filter(a => albumFilter === '전체' || a.category === albumFilter);
        
        const handleDeleteSelectedAlbums = () => {
          setConfirmDialog({
             isOpen: true,
             message: `선택하신 ${selectedAlbumIds.length}장의 사진을\n삭제하시겠습니까?`,
             onConfirm: async () => {
                if (user && db && user.uid !== 'local-test-user') {
                   const promises = selectedAlbumIds.map(id => deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'albums', id)));
                   await Promise.all(promises);
                }
                setSelectedAlbumIds([]);
                setConfirmDialog({ isOpen: false, message: '', onConfirm: null });
             }
          });
        };

        const safeQuery = String(albumSearchQuery || '').toLowerCase().replace(/[\s-]/g, '');

        if (safeQuery) {
          filteredAlbums = filteredAlbums.filter(a => {
             const matchTitle = String(a.title || '').toLowerCase().replace(/[\s-]/g, '').includes(safeQuery);
             const matchRef = String(a.ref || '').toLowerCase().replace(/[\s-]/g, '').includes(safeQuery);
             return matchTitle || matchRef;
          });
        }

        return (
          <div className="flex flex-col h-full bg-[#FCFBF9] font-serif relative" onClick={closeSwipe}>
            <div className="flex flex-col items-center pt-[calc(env(safe-area-inset-top)+16px)] pb-4 relative z-20 shrink-0">
              <a href="https://www.patek.com/en" target="_blank" rel="noopener noreferrer">
                <img src="./logo.png" alt="Patek Philippe" className="w-16 h-16 mb-2 object-contain cursor-pointer hover:opacity-80 transition-opacity" />
              </a>
              <h2 className="text-3xl font-serif text-[#3A3532] tracking-wider mb-5">Album</h2>
              
              <div className="w-full px-5 flex gap-2 relative">
                <div className="flex-1 bg-white border border-[#E8E4DB] rounded-[8px] px-3 py-3 flex items-center shadow-sm">
                  <Search size={20} className="text-[#8A847E] mr-2" />
                  <input type="text" placeholder="사진명 또는 REF 검색" value={albumSearchQuery} onChange={(e) => setAlbumSearchQuery(e.target.value)} className="flex-1 bg-transparent outline-none font-sans text-sm text-[#4A443F] placeholder-[#C2BDB5]" />
                </div>
                <button className="bg-white border border-[#E8E4DB] rounded-[8px] px-4 py-3 shadow-sm flex items-center justify-center text-[#4A443F] hover:bg-[#F2EFE8] transition-colors">
                  <SlidersHorizontal size={20} />
                </button>
              </div>

              <div className="w-full px-5 mt-4 flex gap-2 overflow-x-auto no-scrollbar pb-1" onTouchStart={e => e.stopPropagation()} onTouchMove={e => e.stopPropagation()}>
                {['전체', '착용샷', '실물', '기타'].map(cat => (
                   <button key={cat} onClick={() => setAlbumFilter(cat)} className={`flex-1 py-2 rounded-lg text-[13px] font-sans whitespace-nowrap transition-colors border shadow-sm ${albumFilter === cat ? 'bg-[#8B7355] text-white border-[#8B7355] font-medium' : 'bg-white text-[#8A847E] border-[#E8E4DB]'}`}>
                     {cat}
                   </button>
                ))}
              </div>
            </div>

            <div className="flex-1 overflow-y-auto no-scrollbar pb-8 relative px-5 pt-2">
              <div className="grid grid-cols-2 gap-x-3 gap-y-4">
                {filteredAlbums.map(album => {
                  const isSelected = selectedAlbumIds.includes(album.id);
                  return (
                    <div key={album.id} className={`relative rounded-xl overflow-hidden bg-white shadow-sm border ${isSelected ? 'border-[#8B7355] ring-1 ring-[#8B7355]' : 'border-[#E8E4DB]'} flex flex-col transition-all cursor-pointer`} 
                         onClick={() => {
                           if (selectedAlbumIds.length > 0) {
                             toggleAlbumSelection(album.id);
                           } else {
                             setAlbumForm(JSON.parse(JSON.stringify(album)));
                             setIsAlbumModalOpen(true);
                           }
                         }}>
                      <div className="relative w-full aspect-[4/3] bg-[#F2EFE8]">
                        <img src={album.imageUrl} alt={album.title} className="w-full h-full object-cover" />
                        <div className="absolute top-2 left-2 px-2.5 py-1 bg-white/95 backdrop-blur-sm rounded-md text-[10px] text-[#4A443F] font-bold shadow-sm">{album.category}</div>
                        <button className="absolute top-2 right-2 w-7 h-7 bg-white/95 backdrop-blur-sm rounded-full flex items-center justify-center shadow-sm text-[#4A443F] hover:text-[#8B7355] transition-colors" onClick={(e) => { e.stopPropagation(); toggleAlbumSelection(album.id); handleShareOrSave(); }}>
                           <Share2Icon size={13} strokeWidth={2.5} />
                        </button>
                      </div>
                      
                      <div className="flex justify-between items-center p-2.5 bg-white">
                         <span className="text-[12px] font-medium font-sans text-[#3A3532] truncate flex-1 leading-none">{album.title}</span>
                         <button onClick={(e) => { e.stopPropagation(); toggleAlbumSelection(album.id); }} className="ml-2 shrink-0">
                           {isSelected ? <CheckCircle size={20} className="text-[#8B7355]" filled /> : <CheckCircle size={20} className="text-[#DCD6CC]" />}
                         </button>
                      </div>
                    </div>
                  );
                })}
              </div>
              {filteredAlbums.length === 0 && (
                <div className="flex justify-center items-center h-32 text-[#A8A29D] font-serif text-sm">등록된 사진이 없습니다.</div>
              )}
            </div>

            {selectedAlbumIds.length > 0 && (
              <div className="absolute bottom-[20px] left-5 right-5 rounded-2xl bg-[#3A3532] text-white px-6 py-4 flex justify-between items-center z-40 animate-in slide-in-from-bottom-5 shadow-2xl">
                <div className="flex items-center gap-3">
                   <button onClick={() => setSelectedAlbumIds([])} className="text-[#DCD6CC] hover:text-white transition-colors"><X size={20} /></button>
                   <span className="font-sans font-bold text-[13px]">{selectedAlbumIds.length}장 선택됨</span>
                </div>
                <div className="flex gap-5">
                   <button onClick={handleDeleteSelectedAlbums} className="flex flex-col items-center gap-1 text-[#FF453A] hover:text-[#FF6961] transition-colors">
                     <Trash2 size={20} />
                     <span className="text-[10px] font-sans">삭제</span>
                   </button>
                   <button onClick={handleShareOrSave} className="flex flex-col items-center gap-1 hover:text-[#DCD6CC] transition-colors">
                     <Share2Icon size={20} />
                     <span className="text-[10px] font-sans">공유</span>
                   </button>
                   <button onClick={handleShareOrSave} className="flex flex-col items-center gap-1 hover:text-[#DCD6CC] transition-colors">
                     <DownloadIcon size={20} />
                     <span className="text-[10px] font-sans">저장</span>
                   </button>
                </div>
              </div>
            )}

            {selectedAlbumIds.length === 0 && (
              <button 
                onClick={() => {
                  setAlbumForm({ id: '', files: [], category: '전체', title: '', ref: '', memo: '' });
                  setIsAlbumModalOpen(true);
                }}
                className="absolute bottom-[24px] right-6 w-14 h-14 bg-[#3A3532] text-[#F3EFE8] rounded-full flex items-center justify-center shadow-[0_8px_20px_rgba(58,53,50,0.3)] transition-transform active:scale-95 z-40 border border-[#2A2522]"
              >
                <Plus size={26} strokeWidth={1.2} />
              </button>
            )}
          </div>
        );
      };

      const renderTaskTab = () => {
        let filteredTasks = tasks.filter(t => taskFilter === '전체' || t.category === taskFilter);
        if (taskSortOrder === 'date_desc') filteredTasks.sort((a,b) => b.date.localeCompare(a.date));
        if (taskSortOrder === 'date_asc') filteredTasks.sort((a,b) => a.date.localeCompare(b.date));
        filteredTasks.sort((a, b) => (a.isCompleted === b.isCompleted ? 0 : a.isCompleted ? 1 : -1));

        const toggleTaskCompletion = async (id) => { 
           const targetTask = tasks.find(t => t.id === id);
           if (!targetTask) return;
           if (user.uid !== 'local-test-user') await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'tasks', id), { isCompleted: !targetTask.isCompleted });
        };
        const toggleTaskStar = async (id) => { 
           const targetTask = tasks.find(t => t.id === id);
           if (!targetTask) return;
           if (user.uid !== 'local-test-user') await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'tasks', id), { isStarred: !targetTask.isStarred });
        };

        return (
          <div className="flex flex-col h-full bg-[#FCFBF9] font-serif relative" onClick={closeSwipe}>
            <div className="flex flex-col items-center pt-[calc(env(safe-area-inset-top)+16px)] pb-4 relative z-20 shrink-0">
              <a href="https://www.patek.com/en" target="_blank" rel="noopener noreferrer">
                <img src="./logo.png" alt="Patek Philippe" className="w-16 h-16 mb-3 object-contain cursor-pointer hover:opacity-80 transition-opacity" />
              </a>
              <h2 className="text-3xl font-serif text-[#3A3532] tracking-wider mb-5">Work Notes</h2>
              
              <div className="w-full px-5">
                <div className="border border-[#E8E4DB] rounded-full p-1 flex justify-between bg-white text-[12px] font-sans shadow-sm">
                   {['전체', '매장', '본사', '행사/일정', '고객'].map((cat, i, arr) => (
                       <React.Fragment key={cat}>
                         <button onClick={() => setTaskFilter(cat)} className={`px-2 py-2 rounded-full flex-1 transition-colors ${taskFilter === cat ? 'bg-[#8B7355] text-white font-medium' : 'text-[#8A847E] hover:bg-[#FDFBF7]'}`}>{cat}</button>
                         {i < arr.length - 1 && <div className="w-[1px] bg-[#E8E4DB] my-1" />}
                       </React.Fragment>
                   ))}
                </div>
              </div>
              <div className="w-full px-5 mt-5 flex justify-between items-center text-[13px] text-[#4A443F] font-sans font-medium">
                <div>전체 {filteredTasks.length}</div>
                <div className="relative">
                  <button onClick={() => setIsTaskFilterOpen(!isTaskFilterOpen)} className="flex items-center gap-1 hover:text-[#8B7355] transition-colors">{taskSortOrder === 'date_desc' ? '최신순' : '과거순'} <ChevronRight size={14} className="rotate-90" /></button>
                  {isTaskFilterOpen && (
                    <div className="absolute right-0 top-6 w-24 bg-white border border-[#E8E4DB] rounded-[6px] shadow-lg z-30 overflow-hidden animate-in fade-in">
                      <button onClick={() => { setTaskSortOrder('date_desc'); setIsTaskFilterOpen(false); }} className={`w-full text-left px-3 py-2 hover:bg-[#FDFBF7] ${taskSortOrder === 'date_desc' ? 'font-bold text-[#8B7355]' : 'text-[#4A443F]'}`}>최신순</button>
                      <button onClick={() => { setTaskSortOrder('date_asc'); setIsTaskFilterOpen(false); }} className={`w-full text-left px-3 py-2 hover:bg-[#FDFBF7] border-t border-[#F2EFE8] ${taskSortOrder === 'date_asc' ? 'font-bold text-[#8B7355]' : 'text-[#4A443F]'}`}>과거순</button>
                    </div>
                  )}
                </div>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto no-scrollbar pb-8 relative">
              <div className="bg-white mx-5 border border-[#E8E4DB] rounded-[10px] shadow-[0_2px_10px_rgba(0,0,0,0.02)] overflow-hidden">
                {filteredTasks.map((t, idx) => {
                  const catInfo = TASK_CATEGORIES.find(c => c.label === t.category) || TASK_CATEGORIES[0];
                  return (
                    <div key={t.id} className={`flex items-center py-4 px-4 transition-all duration-300 ${idx !== filteredTasks.length - 1 ? 'border-b border-[#F2EFE8]' : ''} ${t.isCompleted ? 'bg-[#F9F8F6] opacity-60' : 'bg-white hover:bg-[#FDFBF7]'}`}>
                      <div className="flex items-center justify-center mr-3 shrink-0 z-10" onClick={(e) => e.stopPropagation()}>
                        <input type="checkbox" checked={t.isCompleted} onChange={() => toggleTaskCompletion(t.id)} className="w-[16px] h-[16px] accent-[#8B7355] cursor-pointer" />
                      </div>
                      <div className="flex items-center flex-1 min-w-0 cursor-pointer" onClick={() => { setTaskForm(JSON.parse(JSON.stringify(t))); setIsTaskModalOpen(true); }}>
                        <div className={`w-[95px] text-[12px] text-center whitespace-nowrap shrink-0 ${t.isCompleted ? 'text-[#A8A29D]' : 'text-[#6B635C]'}`}>{formatTaskDate(t.date)}</div>
                        <div className="w-[70px] flex justify-center shrink-0 mx-2">
                            <span className={`text-[10px] px-2 py-0.5 rounded-[4px] font-sans whitespace-nowrap ${catInfo.badgeClass} ${t.isCompleted ? 'grayscale opacity-70' : ''}`}>{t.category}</span>
                        </div>
                        <div className={`flex-1 font-sans text-[13px] truncate ${t.isCompleted ? 'text-[#A8A29D] line-through' : 'text-[#2C2724] font-medium'}`}>{t.title}</div>
                      </div>
                      <button onClick={(e) => { e.stopPropagation(); toggleTaskStar(t.id); }} className={`ml-2 z-10 shrink-0 transition-colors ${t.isStarred ? 'text-[#8B7355]' : 'text-[#DCD6CC] hover:text-[#8A847E]'}`}>
                          <Star filled={t.isStarred} size={20} strokeWidth={1.5} />
                      </button>
                    </div>
                  );
                })}
                {filteredTasks.length === 0 && <div className="flex justify-center items-center h-24 text-[#A8A29D] font-serif text-sm">업무가 없습니다.</div>}
              </div>
            </div>

            <button onClick={() => { setTaskForm({ id: '', date: new Date().toISOString().split('T')[0], category: '매장', title: '', memo: '' }); setIsTaskModalOpen(true); }} className="absolute bottom-[24px] right-6 w-14 h-14 bg-[#3A3532] text-[#F3EFE8] rounded-full flex items-center justify-center shadow-[0_8px_20px_rgba(58,53,50,0.3)] transition-transform active:scale-95 z-40 border border-[#2A2522]">
              <Plus size={26} strokeWidth={1.2} />
            </button>
          </div>
        );
      };

      const renderAddModal = () => {
        if (!isAddModalOpen) return null;
        return (
          <div className="absolute inset-0 bg-black/50 backdrop-blur-sm z-[100] flex flex-col justify-end">
            <div className="bg-[#FCFBF9] relative z-[101] rounded-t-3xl p-7 w-full animate-in slide-in-from-bottom-full duration-300 shadow-[0_-15px_40px_rgba(0,0,0,0.15)] border-t border-[#E8E4DB] max-h-[90vh] overflow-y-auto">
              <div className="flex justify-between items-center mb-7">
                <h3 className="text-xl font-serif tracking-widest text-[#3A3532]">{formData.id ? '일정 수정' : '새로운 일정'}</h3>
                <button onClick={() => { setIsAddModalOpen(false); setIsMultiDay(false); }} className="p-2 rounded-full hover:bg-[#F2EFE8] transition-colors"><X size={22} className="text-[#8A847E]" strokeWidth={1.5} /></button>
              </div>
              <div className="space-y-7">
                <div>
                  <label className="block text-[11px] font-medium tracking-widest text-[#8A847E] mb-2 uppercase font-sans">Date</label>
                  <div className="flex items-center gap-2">
                    <input type="date" value={formData.date} onChange={(e) => setFormData({...formData, date: e.target.value})} className="flex-1 bg-transparent border-b border-[#DCD6CC] py-2 text-[#4A443F] focus:border-[#8B7355] outline-none transition-all font-serif text-sm" />
                    {isMultiDay && (
                      <><span className="text-[#8A847E] font-serif">~</span><input type="date" value={formData.endDate} min={formData.date} onChange={(e) => setFormData({...formData, endDate: e.target.value})} className="flex-1 bg-transparent border-b border-[#DCD6CC] py-2 text-[#4A443F] focus:border-[#8B7355] outline-none transition-all font-serif text-sm animate-in fade-in" /></>
                    )}
                    <button onClick={() => { setIsMultiDay(!isMultiDay); if (isMultiDay) setFormData({ ...formData, endDate: '' }); }} className="p-1.5 rounded-[4px] bg-[#F2EFE8] text-[#6B635C] hover:bg-[#E8E4DB] hover:text-[#2C2724] border border-[#E8E4DB] transition-all shrink-0 flex items-center justify-center ml-1 shadow-sm" title={isMultiDay ? "단일 일정으로 변경" : "기간 일정 추가"}>
                      {isMultiDay ? <X size={16} strokeWidth={2} /> : <Plus size={16} strokeWidth={2} />}
                    </button>
                  </div>
                </div>
                <div>
                  <label className="block text-[11px] font-medium tracking-widest text-[#8A847E] mb-3 uppercase font-sans">Category</label>
                  <div className="flex flex-wrap gap-2">
                    {CATEGORIES.map(cat => (
                      <button key={cat.id} onClick={() => setFormData({...formData, categoryId: cat.id})} className={`px-4 py-1.5 rounded-[3px] text-xs font-medium tracking-wide transition-all border font-sans ${formData.categoryId === cat.id ? `border-transparent ${cat.color} ${cat.textColor} shadow-md scale-[1.02]` : 'bg-white text-[#8A847E] border-[#E8E4DB] hover:bg-[#F2EFE8]'}`}>{cat.label}</button>
                    ))}
                  </div>
                </div>
                <div>
                  <label className="block text-[11px] font-medium tracking-widest text-[#8A847E] mb-2 uppercase font-sans">Title</label>
                  <input type="text" placeholder="일정 제목" value={formData.title} onChange={(e) => setFormData({...formData, title: e.target.value})} className="w-full bg-transparent border-b border-[#DCD6CC] py-2 text-[#4A443F] placeholder-[#C2BDB5] focus:border-[#8B7355] outline-none transition-all font-sans text-sm" />
                </div>
                <div>
                  <label className="block text-[11px] font-medium tracking-widest text-[#8A847E] mb-2 uppercase font-sans">Memo</label>
                  <textarea rows="3" placeholder="상세 내용을 입력하세요" value={formData.content} onChange={(e) => setFormData({...formData, content: e.target.value})} className="w-full bg-white border border-[#E8E4DB] rounded-sm shadow-sm p-4 text-[#4A443F] placeholder-[#C2BDB5] focus:ring-1 focus:ring-[#8B7355] focus:border-[#8B7355] outline-none transition-all resize-none text-sm font-serif leading-relaxed"></textarea>
                </div>
                <button onClick={handleSaveEvent} className="w-full bg-[#3A3532] hover:bg-[#2A2522] text-[#F3EFE8] font-serif tracking-widest py-4 rounded-sm mt-2 transition-colors shadow-lg text-sm border border-[#2A2522]">{formData.id ? '수정 완료' : '저장하기'}</button>
              </div>
            </div>
          </div>
        );
      };

      const renderViewModal = () => {
        if (!isViewModalOpen || !selectedEvent) return null;
        const displayDate = selectedEvent.endDate ? `${selectedEvent.date} ~ ${selectedEvent.endDate}` : selectedEvent.date;
        const handleEditClick = () => {
          setFormData({ id: selectedEvent.id, date: selectedEvent.date, endDate: selectedEvent.endDate || '', title: selectedEvent.title, content: selectedEvent.content, categoryId: selectedEvent.categoryId || 'yellow' });
          setIsMultiDay(!!selectedEvent.endDate && selectedEvent.endDate !== selectedEvent.date);
          setIsViewModalOpen(false); setIsAddModalOpen(true);
        };
        const handleDeleteEvent = async (id) => {
          if (user.uid !== 'local-test-user') await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'events', id));
          setIsViewModalOpen(false);
        };
        return (
          <div className="absolute inset-0 bg-black/50 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
            <div className="bg-[#FCFBF9] relative z-[101] rounded-xl p-8 w-full max-w-sm animate-in fade-in duration-300 shadow-[0_20px_50px_rgba(0,0,0,0.2)] border border-[#E8E4DB]">
              <div className="flex justify-between items-start mb-6">
                <div>
                  <span className={`inline-block px-3 py-1 rounded-[3px] text-[10px] tracking-wider font-medium mb-3 border font-sans ${selectedEvent.category.color} ${selectedEvent.category.textColor} ${selectedEvent.category.border}`}>{selectedEvent.category.label}</span>
                  <h3 className="text-2xl font-serif text-[#3A3532] break-all leading-snug">{selectedEvent.title}</h3>
                  <p className="text-[13px] tracking-widest text-[#8A847E] mt-3 font-serif">{displayDate}</p>
                </div>
                <button onClick={() => setIsViewModalOpen(false)} className="p-1.5 rounded-full hover:bg-[#F2EFE8] transition-colors -mr-2 -mt-2"><X size={22} className="text-[#8A847E]" strokeWidth={1.5} /></button>
              </div>
              <div className="bg-white rounded-sm p-5 min-h-[140px] mb-8 whitespace-pre-wrap text-[#4A443F] text-sm border border-[#E8E4DB] shadow-[inset_0_2px_4px_rgba(0,0,0,0.02)] font-serif leading-relaxed">
                {selectedEvent.content || '내용이 없습니다.'}
              </div>
              <div className="flex gap-3 w-full">
                <button onClick={handleEditClick} className="flex-1 bg-[#3A3532] hover:bg-[#2A2522] text-[#F3EFE8] font-serif tracking-widest py-3.5 rounded-sm transition-colors shadow-md border border-[#2A2522] text-sm">수정</button>
                <button onClick={() => handleDeleteEvent(selectedEvent.id)} className="flex-1 bg-white hover:bg-[#FFF5F5] text-[#A06C6C] font-serif tracking-widest py-3.5 rounded-sm transition-colors border border-[#E8D8D8] text-sm">삭제</button>
              </div>
            </div>
          </div>
        );
      };

      const renderCustomerModal = () => {
        if (!isCustomerModalOpen || !customerForm) return null;

        const handleSaveCustomer = async () => {
          if (!customerForm.name.trim()) { setAlertMessage("고객명을 입력해주세요."); return; }
          const payload = { ...customerForm };
          const targetId = payload.id;
          delete payload.id; 
          
          if (user.uid !== 'local-test-user') {
             if (targetId) await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'customers', targetId), payload);
             else await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'customers'), payload);
          }
          setIsCustomerModalOpen(false); setCustomerForm(null);
        };

        const updatePurchase = (index, field, value) => {
          const newPurchases = [...customerForm.purchases];
          if (field === 'amount') newPurchases[index][field] = value.replace(/,/g, '');
          else newPurchases[index][field] = value;
          setCustomerForm({ ...customerForm, purchases: newPurchases });
        };

        const confirmDeletePurchase = (index) => {
          setConfirmDialog({
             isOpen: true,
             message: "해당 내역을\n삭제하시겠습니까?",
             onConfirm: () => {
                const newPurchases = customerForm.purchases.filter((_, i) => i !== index);
                setCustomerForm({ ...customerForm, purchases: newPurchases });
                setConfirmDialog({ isOpen: false, message: '', onConfirm: null });
             }
          });
        };

        const addPurchaseRow = () => {
          setCustomerForm({ ...customerForm, purchases: [...customerForm.purchases, { id: Date.now().toString(), date: '', ref: '', qty: '', amount: '', note: '' }] });
        };

        const handleWishlistClick = () => {
          const inquiry = inquiries.find((i) => i.customerName === customerForm.name && i.customerPhone === customerForm.phone);
          if (inquiry) {
            setInquiryForm(JSON.parse(JSON.stringify(inquiry))); setIsInquiryModalOpen(true); setActiveTab('inquiries'); setIsCustomerModalOpen(false);
          } else { setAlertMessage("현재 등록된\nWish List가 없습니다."); }
        };

        const totalQty = customerForm.purchases.reduce((sum, p) => sum + (Number(p.qty) || 0), 0);
        const totalAmount = customerForm.purchases.reduce((sum, p) => sum + (Number(p.amount) || 0), 0);

        return (
          <div className="absolute inset-0 bg-[#FCFBF9] z-[100] flex flex-col font-sans animate-in slide-in-from-bottom-5">
            <div className="flex justify-between items-center px-5 pt-8 pb-4 bg-[#FCFBF9] sticky top-0 z-20 shrink-0">
              <button onClick={() => setIsCustomerModalOpen(false)} className="text-[#8A847E] text-[15px] hover:text-[#4A443F] py-2">취소</button>
              <a href="https://www.patek.com/en" target="_blank" rel="noopener noreferrer" className="absolute left-1/2 -translate-x-1/2 flex flex-col items-center top-6">
                 <img src="./logo.png" alt="Logo" className="w-12 h-12 object-contain" />
                 <span className="font-serif text-[18px] text-[#3A3532] -mt-1">Customer</span>
              </a>
              <button onClick={handleSaveCustomer} className="text-[#8B7355] text-[15px] font-medium hover:text-[#6B5335] py-2">저장</button>
            </div>

            <div className="flex-1 overflow-y-auto px-5 pb-8 mt-6 no-scrollbar">
              <div className="relative flex items-center justify-center mb-6 h-12">
                <input type="text" value={customerForm.name} onChange={(e) => setCustomerForm({...customerForm, name: e.target.value})} placeholder="고객명 입력" className="text-3xl font-serif font-bold text-center text-[#2C2724] bg-transparent outline-none w-full placeholder-[#DCD6CC]" />
                <div className="absolute right-0 top-0 bottom-0 flex items-center justify-center p-1">
                  <img src="./wish.png" alt="Wishlist" className="h-full w-auto object-contain cursor-pointer hover:opacity-80 transition-opacity drop-shadow-sm" onClick={handleWishlistClick} />
                </div>
              </div>

              <div className="bg-white border border-[#E8E4DB] rounded-xl p-5 mb-5 shadow-[0_2px_10px_rgba(0,0,0,0.02)]">
                <div className="flex items-center py-3 border-b border-[#F2EFE8]">
                  <span className="text-[13px] text-[#8A847E] w-[55px] shrink-0">고객명</span>
                  <input type="text" value={customerForm.name} onChange={(e) => setCustomerForm({...customerForm, name: e.target.value})} className="bg-transparent outline-none text-[#2C2724] flex-1 text-sm min-w-[50px]" placeholder="이름" />
                  <span className="text-[13px] text-[#8A847E] w-auto whitespace-nowrap mx-2 shrink-0">생년월일</span>
                  <input type="text" value={customerForm.birthDate} onChange={(e) => setCustomerForm({...customerForm, birthDate: formatBirthDate(e.target.value)})} className="bg-transparent outline-none text-[#4A443F] text-sm text-right w-[76px] shrink-0 tracking-tight" placeholder="YYYY.MM.DD" maxLength="10" />
                </div>
                <div className="flex items-center py-3 border-b border-[#F2EFE8]">
                  <span className="text-[13px] text-[#8A847E] w-[60px] shrink-0">연락처</span>
                  <input type="text" value={customerForm.phone} onChange={(e) => setCustomerForm({...customerForm, phone: formatPhoneNumber(e.target.value)})} className="bg-transparent outline-none text-[#2C2724] flex-1 text-sm min-w-0" placeholder="010-0000-0000" maxLength="13" />
                </div>
                <div className="flex items-center py-3 border-b border-[#F2EFE8]">
                  <span className="text-[13px] text-[#8A847E] w-[60px] shrink-0">직업</span>
                  <input type="text" value={customerForm.job} onChange={(e) => setCustomerForm({...customerForm, job: e.target.value})} className="bg-transparent outline-none text-[#2C2724] flex-1 text-sm min-w-0" placeholder="직업 입력" />
                </div>
                <div className="flex items-start pt-3">
                  <span className="text-[13px] text-[#8A847E] w-[60px] shrink-0 mt-1">특이사항</span>
                  <textarea value={customerForm.notes} onChange={(e) => setCustomerForm({...customerForm, notes: e.target.value})} className="bg-transparent outline-none text-[#2C2724] flex-1 text-sm resize-none h-16 min-w-0" placeholder="특이사항 메모"></textarea>
                </div>
              </div>

              <div className="bg-[#FDFBF7] border border-[#E8E4DB] rounded-xl flex items-center py-5 mb-5 shadow-[0_2px_10px_rgba(0,0,0,0.02)]">
                <div className="flex-1 text-center border-r border-[#E8E4DB]"><div className="font-sans font-bold text-xl text-[#2C2724]">{totalQty}PCS</div></div>
                <div className="flex-[1.5] text-center"><div className="font-serif font-bold text-xl text-[#2C2724]">₩{totalAmount.toLocaleString()}</div></div>
              </div>

              <div className="bg-white border border-[#E8E4DB] rounded-xl overflow-hidden shadow-[0_2px_10px_rgba(0,0,0,0.02)] mb-8">
                <div className="flex items-center gap-2 p-4 border-b border-[#E8E4DB] bg-[#FCFBF9]">
                  <ClipboardList size={18} className="text-[#8B7355]" />
                  <span className="font-serif font-bold text-[#3A3532] text-[15px]">구매 내역</span>
                </div>
                
                <div className="overflow-x-auto no-scrollbar" onTouchStart={e => e.stopPropagation()} onTouchMove={e => e.stopPropagation()}>
                  <div className="min-w-[520px]">
                    <div className="grid grid-cols-[1.3fr_1.3fr_0.7fr_1.6fr_1.2fr_40px] text-[11px] text-[#8A847E] bg-[#FDFBF7] py-2 border-b border-[#E8E4DB] text-center">
                      <div>구매일</div><div>REF.</div><div>수량</div><div>금액</div><div>비고</div><div>삭제</div>
                    </div>
                    {customerForm.purchases.map((p, idx) => (
                      <div key={p.id} className="grid grid-cols-[1.3fr_1.3fr_0.7fr_1.6fr_1.2fr_40px] border-b border-[#F2EFE8] items-center text-[12px] text-[#4A443F]">
                        <input type="text" value={p.date} onChange={(e) => updatePurchase(idx, 'date', e.target.value)} placeholder="YYYY-MM-DD" className="w-full bg-transparent text-center py-3 outline-none" />
                        <input type="text" value={p.ref} onChange={(e) => updatePurchase(idx, 'ref', e.target.value)} placeholder="REF" className="w-full bg-transparent text-center py-3 outline-none border-l border-[#F2EFE8]" />
                        <input type="number" value={p.qty} onChange={(e) => updatePurchase(idx, 'qty', e.target.value)} placeholder="0" className="w-full bg-transparent text-center py-3 outline-none border-l border-[#F2EFE8]" />
                        <div className="relative border-l border-[#F2EFE8] h-full flex items-center">
                          <span className="absolute left-1.5 text-[#8A847E] text-[11px]">₩</span>
                          <input type="text" value={formatAmount(p.amount)} onChange={(e) => updatePurchase(idx, 'amount', e.target.value)} placeholder="0" className="w-full bg-transparent text-right pr-2 py-3 outline-none" />
                        </div>
                        <input type="text" value={p.note} onChange={(e) => updatePurchase(idx, 'note', e.target.value)} className="w-full bg-transparent text-center py-3 outline-none border-l border-[#F2EFE8]" placeholder="비고" />
                        <div className="border-l border-[#F2EFE8] h-full flex items-center justify-center">
                           <button onClick={() => confirmDeletePurchase(idx)} className="text-[#DCD6CC] hover:text-[#A06C6C] transition-colors"><Trash2 size={16} /></button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
                <button onClick={addPurchaseRow} className="w-full py-3 bg-[#6B5A47] hover:bg-[#5A4B3A] text-white flex items-center justify-center gap-2 transition-colors"><Plus size={16} /> <span className="font-sans text-sm tracking-wide">추가하기</span></button>
              </div>
            </div>
          </div>
        );
      };

      const renderInquiryModal = () => {
        if (!isInquiryModalOpen || !inquiryForm) return null;

        const handleSaveInquiry = async () => {
          if (!inquiryForm.customerName.trim()) { setAlertMessage("고객명을 입력해주세요."); return; }
          if (!inquiryForm.date.trim()) { setAlertMessage("문의일자를 입력해주세요."); return; }
          const payload = { ...inquiryForm };
          const targetId = payload.id;
          delete payload.id; 
          
          if (user.uid !== 'local-test-user') {
             if (targetId) await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'inquiries', targetId), payload);
             else await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'inquiries'), payload);
          }
          setIsInquiryModalOpen(false); setInquiryForm(null); setFocusedRefIndex(null);
        };

        const updateInquiryItem = (itemId, field, value) => {
          const newItems = inquiryForm.items.map(item => item.id === itemId ? { ...item, [field]: value } : item);
          setInquiryForm({ ...inquiryForm, items: newItems });
        };

        const confirmDeleteInquiryItem = (itemId) => {
          setConfirmDialog({
             isOpen: true,
             message: "해당 내역을\n삭제하시겠습니까?",
             onConfirm: () => {
                const newItems = inquiryForm.items.filter(item => item.id !== itemId);
                setInquiryForm({ ...inquiryForm, items: newItems });
                setConfirmDialog({ isOpen: false, message: '', onConfirm: null });
             }
          });
        };

        const addInquiryItem = () => {
          setInquiryForm({ ...inquiryForm, items: [...inquiryForm.items, { id: Date.now().toString(), date: '', ref: '', proposedDate: '', note: '', isCompleted: false }] });
        };

        const handleCustomerClick = () => {
          const customer = customers.find((c) => c.name === inquiryForm.customerName && c.phone === inquiryForm.customerPhone);
          if (customer) {
            setCustomerForm(JSON.parse(JSON.stringify(customer))); setIsCustomerModalOpen(true); setActiveTab('customer'); setIsInquiryModalOpen(false);
          } else { setAlertMessage("구매내역이 \n없습니다."); }
        };

        const sortedItems = [...inquiryForm.items].sort((a, b) => (a.isCompleted === b.isCompleted ? 0 : a.isCompleted ? 1 : -1));

        return (
          <div className="absolute inset-0 bg-[#FCFBF9] z-[100] flex flex-col font-sans animate-in slide-in-from-bottom-5">
            <div className="flex justify-between items-center px-5 pt-8 pb-4 bg-[#FCFBF9] sticky top-0 z-20 shrink-0">
              <button onClick={() => { setIsInquiryModalOpen(false); setFocusedRefIndex(null); }} className="text-[#8A847E] text-[15px] hover:text-[#4A443F] py-2">취소</button>
              <a href="https://www.patek.com/en" target="_blank" rel="noopener noreferrer" className="absolute left-1/2 -translate-x-1/2 flex flex-col items-center top-6">
                 <img src="./logo.png" alt="Logo" className="w-12 h-12 object-contain" />
                 <span className="font-serif text-[18px] text-[#3A3532] -mt-1">Wish List</span>
              </a>
              <button onClick={handleSaveInquiry} className="text-[#8B7355] text-[15px] font-medium hover:text-[#6B5335] py-2">저장</button>
            </div>

            <div className="flex-1 overflow-y-auto px-5 pb-8 mt-6 no-scrollbar">
              <div className="relative flex items-center justify-center mb-6 h-12">
                <input type="text" value={inquiryForm.customerName} onChange={(e) => setInquiryForm({...inquiryForm, customerName: e.target.value})} placeholder="고객명 입력" className="text-3xl font-serif font-bold text-center text-[#2C2724] bg-transparent outline-none w-full placeholder-[#DCD6CC]" />
                <div className="absolute right-0 top-0 bottom-0 flex items-center justify-center p-1">
                  <img src="./customer.png" alt="Customer" className="h-full w-auto object-contain cursor-pointer hover:opacity-80 transition-opacity" onClick={handleCustomerClick} />
                </div>
              </div>

              <div className="bg-white border border-[#E8E4DB] rounded-xl p-5 mb-8 shadow-[0_2px_10px_rgba(0,0,0,0.02)]">
                <div className="flex items-center py-3 border-b border-[#F2EFE8]">
                  <span className="text-[13px] text-[#8A847E] w-[55px] shrink-0">분류</span>
                  <div className="flex gap-2 flex-1 relative">
                    <select 
                      value={inquiryForm.type} 
                      onChange={(e) => setInquiryForm({...inquiryForm, type: e.target.value})} 
                      className="flex-1 bg-transparent outline-none text-[#2C2724] text-sm appearance-none cursor-pointer w-full"
                    >
                      <option value="기존">기존</option>
                      <option value="신규">신규</option>
                    </select>
                    <ChevronRight size={14} className="absolute right-1 top-1/2 -translate-y-1/2 text-[#A8A29D] pointer-events-none rotate-90" />
                  </div>
                </div>

                <div className="flex items-center py-3 border-b border-[#F2EFE8]">
                  <span className="text-[13px] text-[#8A847E] w-[55px] shrink-0">문의일자</span>
                  <div className="flex-1 flex items-center gap-2">
                     <input 
                       type="text" 
                       value={inquiryForm.date} 
                       onChange={(e) => setInquiryForm({...inquiryForm, date: formatDateInput(e.target.value)})} 
                       className="bg-transparent outline-none text-[#2C2724] text-sm flex-1 tracking-tight" 
                       placeholder="YYYY.MM.DD" 
                       maxLength="10" 
                     />
                     <div className="relative flex items-center justify-center w-6 h-6">
                        <CalendarDays size={18} className="text-[#A8A29D] pointer-events-none" />
                        {/* Native Date Picker Overlay */}
                        <input 
                           type="date" 
                           className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                           onChange={(e) => {
                             if(e.target.value) setInquiryForm({...inquiryForm, date: e.target.value.replace(/-/g, '.')});
                           }}
                        />
                     </div>
                  </div>
                </div>
